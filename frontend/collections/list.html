<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Liste des collections</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <div class="container mt-4">
    <h1>Liste des collections</h1>

    <a href="add.html" class="btn btn-success mb-3">Ajouter une collection</a>
    <a href="../index.html" class="btn btn-primary mb-3 ms-2">Retour au menu principal</a>

    <table class="table table-striped">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nom</th>
          <th>Description</th>
        </tr>
      </thead>
      <tbody id="collections-table-body">
        <!-- Les collections seront ajoutées ici via JS -->
      </tbody>
    </table>
  </div>

  <script>
    async function loadCollections() {
      try {
        const res = await fetch('http://localhost:3000/api/collections');
        if (!res.ok) throw new Error('Erreur serveur');

        const collections = await res.json();

        const tbody = document.getElementById('collections-table-body');
        tbody.innerHTML = '';

        collections.forEach(c => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${c._id}</td>
            <td>${c.nom}</td>
            <td>${c.description || ''}</td>
          `;
          tbody.appendChild(tr);
        });
      } catch (error) {
        alert('Erreur lors du chargement des collections : ' + error.message);
      }
    }

    document.addEventListener('DOMContentLoaded', loadCollections);
  </script>
</body>
</html>
