<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ajouter une collection</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <div class="container mt-4">
    <h1>Ajouter une collection</h1>

    <form id="add-collection-form">
      <div class="mb-3">
        <label for="nom" class="form-label">Nom</label>
        <input type="text" id="nom" name="nom" class="form-control" required />
      </div>
      <div class="mb-3">
        <label for="description" class="form-label">Description</label>
        <textarea id="description" name="description" class="form-control"></textarea>
      </div>

      <button type="submit" class="btn btn-success">Ajouter</button>
      <a href="list.html" class="btn btn-secondary">Voir la liste</a>
      <a href="../index.html" class="btn btn-primary">Retour au menu principal</a>
    </form>
  </div>

  <script>
    const form = document.getElementById('add-collection-form');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const data = {
        nom: form.nom.value,
        description: form.description.value
      };

      try {
        const res = await fetch('http://localhost:3000/api/collections', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        if (res.ok) {
          alert('Collection ajoutée avec succès');
          window.location.href = 'list.html';
        } else {
          alert('Erreur lors de l\'ajout');
        }
      } catch (error) {
        alert('Erreur réseau');
        console.error(error);
      }
    });
  </script>
</body>
</html>
