<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Liste Clients</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <div class="container mt-4">
    <h1>Liste des Clients</h1>
    <a href="add.html" class="btn btn-success mb-3">Ajouter un client</a>

    <table class="table table-bordered table-hover">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nom</th>
          <th>Email</th>
          <th>Téléphone</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="clients-table-body"></tbody>
    </table>
  </div>

  <script>
    async function fetchClients() {
      try {
        const res = await fetch('http://localhost:3000/clients');
        const clients = await res.json();
        const tbody = document.getElementById('clients-table-body');
        tbody.innerHTML = '';

        clients.forEach(client => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${client._id}</td>
            <td>${client.nom}</td>
            <td>${client.email}</td>
            <td>${client.telephone}</td>
            <td>
              <a href="edit.html?id=${client._id}" class="btn btn-primary btn-sm">Modifier</a>
              <button class="btn btn-danger btn-sm" onclick="deleteClient('${client._id}')">Supprimer</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (error) {
        alert('Erreur lors du chargement des clients');
        console.error(error);
      }
    }

    async function deleteClient(id) {
      if (!confirm('Voulez-vous vraiment supprimer ce client ?')) return;

      try {
        const res = await fetch(`http://localhost:3000/clients/${id}`, {
          method: 'DELETE'
        });
        if (res.ok) {
          alert('Client supprimé');
          fetchClients();
        } else {
          alert('Erreur lors de la suppression');
        }
      } catch (error) {
        alert('Erreur réseau');
        console.error(error);
      }
    }

    window.onload = fetchClients;
  </script>
</body>
</html>
