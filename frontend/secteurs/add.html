<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ajouter un secteur d'activité</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>

<main class="container mt-4">
  <h1>Ajouter un nouveau secteur d'activité</h1>
  <form id="form-secteur" class="mt-3">
    <div class="mb-3">
      <label for="nom" class="form-label">Nom du secteur *</label>
      <input type="text" id="nom" name="nom" class="form-control" required />
    </div>
    <button type="submit" class="btn btn-primary">Enregistrer</button>
  </form>
</main>

<script>
  const form = document.getElementById('form-secteur');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const nom = form.nom.value.trim();
    if (!nom) {
      alert("Le nom du secteur est obligatoire.");
      return;
    }

    try {
    
      const response = await fetch('http://localhost:3000/api/secteurs', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ nom })
      });

      if (!response.ok) {
        const errorText = await response.text();
        throw new Error(errorText);
      }

      alert("Secteur d'activité ajouté avec succès !");
      form.reset();

    } catch (error) {
      alert("Erreur lors de l'ajout : " + error.message);
    }
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
