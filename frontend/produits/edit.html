<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Modifier un produit</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
      <a class="navbar-brand" href="../index.html">Gestion</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
              aria-controls="navbarNav" aria-expanded="false" aria-label="Basculer la navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="../clients/list.html">Clients</a></li>
          <li class="nav-item"><a class="nav-link active" href="list.html">Produits</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container">
    <h1 class="mb-4">Modifier un produit</h1>

    <form id="form-produit" novalidate>
      <div class="mb-3">
        <label for="nom" class="form-label">Nom <span class="text-danger">*</span></label>
        <input type="text" id="nom" name="nom" class="form-control" required value="Produit A" />
        <div class="invalid-feedback">Le nom est obligatoire.</div>
      </div>

      <div class="mb-3">
        <label for="description" class="form-label">Description</label>
        <textarea id="description" name="description" rows="4" class="form-control">Produit de haute qualité</textarea>
      </div>

      <div class="mb-3">
        <label for="prix" class="form-label">Prix (€)</label>
        <input type="number" id="prix" name="prix" class="form-control" step="0.01" value="29.99" min="0" />
      </div>

      <div class="mb-3">
        <label for="catalogue" class="form-label">Catalogue</label>
        <select id="catalogue" name="catalogue" class="form-select">
          <option value="">-- Choisir un catalogue --</option>
          <option value="1" selected>Catalogue 1</option>
          <option value="2">Catalogue 2</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="image_url" class="form-label">URL de l'image</label>
        <input type="url" id="image_url" name="image_url" class="form-control" value="https://example.com/image.jpg" />
      </div>

      <button type="submit" class="btn btn-primary">Enregistrer les modifications</button>
      <a href="list.html" class="btn btn-secondary ms-2">Annuler</a>
    </form>
  </main>

  <script>
    (() => {
      'use strict';

      const form = document.getElementById('form-produit');

      form.addEventListener('submit', event => {
        event.preventDefault();
        event.stopPropagation();

        if (!form.checkValidity()) {
          form.classList.add('was-validated');
          return;
        }

        const produit = {
          nom: form.nom.value.trim(),
          description: form.description.value.trim(),
          prix: parseFloat(form.prix.value) || 0,
          catalogue: form.catalogue.value,
          image_url: form.image_url.value.trim()
        };

        console.log('Produit à enregistrer:', produit);
        alert('Modifications enregistrées avec succès !');

      });
    })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
