<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Liste des produits</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand" href="../index.html">Gestion</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Basculer la navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="../clients/list.html">Clients</a></li>
        <li class="nav-item"><a class="nav-link active" href="list.html">Produits</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container">
  <h1 class="mb-4">Liste des produits</h1>
  <a href="add.html" class="btn btn-success mb-3">Ajouter un produit</a>

  <table class="table table-striped table-hover">
    <thead class="table-primary">
      <tr>
        <th>Nom</th>
        <th>Description</th>
        <th>Prix (€)</th>
        <th>Catalogue</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Produit A</td>
        <td>Produit de haute qualité</td>
        <td>29.99</td>
        <td>Catalogue 1</td>
        <td>
          <a href="edit.html?id=1" class="btn btn-sm btn-primary me-2">Modifier</a>
          <button class="btn btn-sm btn-danger" onclick="confirmDeletion(1)">Supprimer</button>
        </td>
      </tr>
      <tr>
        <td>Produit B</td>
        <td>Produit économique</td>
        <td>15.00</td>
        <td>Catalogue 2</td>
        <td>
          <a href="edit.html?id=2" class="btn btn-sm btn-primary me-2">Modifier</a>
          <button class="btn btn-sm btn-danger" onclick="confirmDeletion(2)">Supprimer</button>
        </td>
      </tr>
    </tbody>
  </table>
</main>

<script>
  function confirmDeletion(id) {
    if (confirm('Confirmer la suppression du produit ID ' + id + ' ?')) {
     
      alert('Produit supprimé (simulation).');
    
    }
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
