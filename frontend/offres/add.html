<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ajouter une offre</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">

  <div class="container my-5">
    <div class="card shadow-sm mx-auto" style="max-width: 600px;">
      <div class="card-body">
        <h1 class="card-title mb-4 text-center">Ajouter une nouvelle offre</h1>
        <form>
          <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea id="description" name="description" rows="4" class="form-control" placeholder="Décrivez l'offre..."></textarea>
          </div>

          <div class="mb-3">
            <label for="dateoffre" class="form-label">Date de l'offre</label>
            <input type="date" id="dateoffre" name="dateoffre" class="form-control" />
          </div>

          <div class="mb-4">
            <label for="client" class="form-label">Client</label>
            <select id="client" name="client" class="form-select">
              <option value="">-- Sélectionnez un client --</option>
              <option value="1">Client A</option>
              <option value="2">Client B</option>
              <option value="3">Client C</option>
            </select>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-primary">Enregistrer</button>
          </div>
        </form>
      </div>
    </div>
  </div>

 
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
