<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Liste des offres</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">

  <div class="container my-5">
    <h1 class="mb-4">Liste des offres</h1>
    <a href="add.html" class="btn btn-success mb-3">Ajouter une offre</a>

    <div class="table-responsive">
      <table class="table table-bordered table-hover align-middle">
        <thead class="table-light">
          <tr>
            <th>Description</th>
            <th>Date de l'offre</th>
            <th>Client</th>
            <th style="width: 180px;">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Offre spéciale été</td>
            <td>2025-07-01</td>
            <td>Client A</td>
            <td>
              <a href="#" class="btn btn-sm btn-info me-1">Voir</a>
              <a href="#" class="btn btn-sm btn-primary me-1">Modifier</a>
              <button class="btn btn-sm btn-danger">Supprimer</button>
            </td>
          </tr>
          <tr>
            <td>Remise de lancement</td>
            <td>2025-08-15</td>
            <td>Client B</td>
            <td>
              <a href="#" class="btn btn-sm btn-info me-1">Voir</a>
              <a href="#" class="btn btn-sm btn-primary me-1">Modifier</a>
              <button class="btn btn-sm btn-danger">Supprimer</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Bootstrap JS Bundle (optionnel si besoin de fonctionnalités JS) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
