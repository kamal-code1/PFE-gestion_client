<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Liste des fournisseurs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

  <h1 class="mb-4">Liste des fournisseurs</h1>

  <a href="add.html" class="btn btn-success mb-3">➕ Ajouter un fournisseur</a>

  <table class="table table-bordered">
    <thead class="table-dark">
      <tr>
        <th>#</th>
        <th>Nom</th>
        <th>Adresse</th>
        <th>Téléphone</th>
        <th>Email</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="fournisseurs-table-body">
      <!-- Les données JS seront injectées ici -->
    </tbody>
  </table>

  <script>
    const API_URL = 'http://localhost:3000/api/fournisseurs';
    const tableBody = document.getElementById('fournisseurs-table-body');

    async function chargerFournisseurs() {
      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error('Erreur lors du chargement');

        const fournisseurs = await response.json();

        tableBody.innerHTML = '';

        fournisseurs.forEach((f, index) => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${index + 1}</td>
            <td>${f.nom}</td>
            <td>${f.adresse}</td>
            <td>${f.telephone}</td>
            <td>${f.email}</td>
            <td>
              <button class="btn btn-sm btn-danger" onclick="supprimerFournisseur('${f._id}')">Supprimer</button>
            </td>
          `;
          tableBody.appendChild(row);
        });
      } catch (err) {
        console.error(err);
        tableBody.innerHTML = '<tr><td colspan="6" class="text-danger">Erreur de chargement</td></tr>';
      }
    }

    async function supprimerFournisseur(id) {
      if (!confirm('Supprimer ce fournisseur ?')) return;

      try {
        const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
        if (!response.ok) throw new Error('Erreur de suppression');
        chargerFournisseurs();
      } catch (err) {
        alert("Erreur lors de la suppression : " + err.message);
      }
    }

    // Charger la liste au chargement de la page
    document.addEventListener('DOMContentLoaded', chargerFournisseurs);
  </script>

</body>
</html>
