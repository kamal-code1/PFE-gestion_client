<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ajouter un produit</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>

<main class="container mt-4">
  <h1>Ajouter un produit</h1>

  <form id="form-produit" class="mt-3">
    <div class="mb-3">
      <label for="nom" class="form-label">Nom *</label>
      <input type="text" id="nom" name="nom" class="form-control" required />
    </div>

    <div class="mb-3">
      <label for="description" class="form-label">Description</label>
      <textarea id="description" name="description" class="form-control" rows="4"></textarea>
    </div>

    <div class="mb-3">
      <label for="prix" class="form-label">Prix (€)</label>
      <input type="number" id="prix" name="prix" class="form-control" step="0.01" />
    </div>

    <div class="mb-3">
      <label for="catalogue" class="form-label">Catalogue</label>
      <select id="catalogue" name="catalogue" class="form-select">
        <option value="">-- Choisir un catalogue --</option>
        <option value="1">Catalogue 1</option>
        <option value="2">Catalogue 2</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="image_url" class="form-label">URL de l'image</label>
      <input type="url" id="image_url" name="image_url" class="form-control" />
    </div>

    <button type="submit" class="btn btn-primary">Enregistrer</button>
  </form>
</main>

<script>
  const form = document.getElementById('form-produit');

  form.addEventListener('submit', async (event) => {
    event.preventDefault();

    const produit = {
      nom: form.nom.value.trim(),
      description: form.description.value.trim(),
      prix: parseFloat(form.prix.value) || 0,
      catalogue: form.catalogue.value,
      image_url: form.image_url.value.trim()
    };

    if (!produit.nom) {
      alert('Le nom est obligatoire.');
      return;
    }

    try {
    
      const response = await fetch('http://localhost:3000/api/produits', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(produit)
      });

      if (!response.ok) {
        const errorText = await response.text();
        throw new Error(errorText);
      }

      alert('Produit ajouté avec succès !');
      form.reset();
   ;
    } catch (error) {
      alert('Erreur lors de l\'ajout : ' + error.message);
    }
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
