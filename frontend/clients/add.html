<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ajouter un Client</title>
  <link href="../css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <div class="container mt-5">
    <div class="card shadow">
      <div class="card-header bg-success text-white">
        <h3 class="mb-0">Ajouter un client</h3>
      </div>
      <div class="card-body">
        <form id="add-client-form">
          <div class="mb-3">
            <label for="nom" class="form-label">Nom <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="nom" placeholder="Entrez le nom" required />
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" placeholder="exemple@domaine.com" />
          </div>
          <div class="mb-3">
            <label for="telephone" class="form-label">Téléphone</label>
            <input type="text" class="form-control" id="telephone" placeholder="+213..." />
          </div>
          <div class="d-flex justify-content-between">
            <a href="list.html" class="btn btn-secondary">Annuler</a>
            <button type="submit" class="btn btn-success">Ajouter</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('add-client-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const nom = document.getElementById('nom').value.trim();
      const email = document.getElementById('email').value.trim();
      const telephone = document.getElementById('telephone').value.trim();

      if (!nom) {
        alert('Le nom est obligatoire.');
        return;
      }

      try {
        const res = await fetch('http://localhost:3000/api/clients', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nom, email, telephone })
        });

        if (!res.ok) throw new Error("Erreur lors de l'ajout du client.");

        alert('Client ajouté avec succès !');
        window.location.href = 'list.html';
      } catch (error) {
        alert('Erreur : ' + error.message);
      }
    });
  </script>

  <script src="../js/bootstrap.bundle.min.js"></script>
</body>
</html>
